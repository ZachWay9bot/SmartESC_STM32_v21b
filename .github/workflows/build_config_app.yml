name: Build DeltaESC Config APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ vesc_comp ]
    paths:
      - 'android/SmartESCConfig/**'
      - '.github/workflows/build_config_app.yml'
      - 'docs/G30D_RC1.md'
  push:
    branches: [ feature/g30-config-app, feature/deltaesc-branding, feature/deltaesc-stock-diagnostic, freeze/deltaesc-v0.2-hwtest-2026-10-03, release-candidate/deltaesc-g30d-rc1 ]
    paths:
      - 'android/SmartESCConfig/**'
      - '.github/workflows/build_config_app.yml'
      - 'docs/G30D_RC1.md'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test protocol
        run: gradle -p android/SmartESCConfig :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: |
          gradle -p android/SmartESCConfig :app:assembleDebug --no-daemon
          cp android/SmartESCConfig/app/build/outputs/apk/debug/app-debug.apk DeltaESC_Config_v0.3.0_RC1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeltaESC-Config-v0.3-RC1-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: DeltaESC_Config_v0.3.0_RC1.apk
