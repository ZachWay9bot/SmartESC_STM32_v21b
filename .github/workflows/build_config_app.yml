name: Build SmartESC Config APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ vesc_comp ]
    paths:
      - 'android/SmartESCConfig/**'
      - '.github/workflows/build_config_app.yml'
  push:
    branches: [ feature/g30-config-app ]
    paths:
      - 'android/SmartESCConfig/**'
      - '.github/workflows/build_config_app.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android/SmartESCConfig :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartESC-Config-Android-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: android/SmartESCConfig/app/build/outputs/apk/debug/app-debug.apk
