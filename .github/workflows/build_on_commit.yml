name: Build G30 NativeDash on commit

on:
  push:
    branches: [ vesc_comp ]
    paths:
      - 'g30p/**'
      - 'common_files/**'
      - 'tools/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ vesc_comp ]
    paths:
      - 'g30p/**'
      - 'common_files/**'
      - 'tools/**'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  g30:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build G30P
        uses: docker://wsbu/stm32cubeide:latest
        with:
          entrypoint: /opt/stm32cubeide/stm32cubeide
          args: --launcher.suppressErrors -nosplash -application org.eclipse.cdt.managedbuilder.core.headlessbuild -build g30p/Debug -importAll /github/workspace/

      - name: Audit linked G30 SRAM allocation (read only)
        run: |
          python3 tools/audit_g30_ram.py \
            --elf g30p/STM32CubeIDE/Debug/g30p.elf \
            --json-out g30-ram-audit.json

      - name: Build SHU package
        run: |
          python3 tools/make_shu_zip.py \
            g30p/STM32CubeIDE/Debug/g30p.bin \
            SmartESC_G30_NativeDash_v0.8.7_SHU.zip \
            --name "SmartESC G30 NativeDash v0.8.7"

      - name: Prepare versioned IAP payload
        run: |
          mkdir -p firmware/v0.8.7
          cp SmartESC_G30_NativeDash_v0.8.7_SHU.zip firmware/v0.8.7/SmartESC_G30_NativeDash_v0.8.7_SHU.zip
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile('SmartESC_G30_NativeDash_v0.8.7_SHU.zip', 'r')
          data = z.read('FIRM.bin.enc')
          open('firmware/v0.8.7/SmartESC_G30_NativeDash_v0.8.7_IAP_Driver.bin', 'wb').write(data)
          print('IAP Driver.bin:', len(data), 'bytes')
          PY
          (cd firmware/v0.8.7 && sha256sum SmartESC_G30_NativeDash_v0.8.7_SHU.zip SmartESC_G30_NativeDash_v0.8.7_IAP_Driver.bin > SHA256SUMS.txt)
          {
            echo "SmartESC G30 NativeDash v0.8.7"
            echo "Source commit: ${GITHUB_SHA}"
            echo "Workflow run: ${GITHUB_RUN_NUMBER}"
            echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            wc -c firmware/v0.8.7/SmartESC_G30_NativeDash_v0.8.7_SHU.zip
            wc -c firmware/v0.8.7/SmartESC_G30_NativeDash_v0.8.7_IAP_Driver.bin
          } > firmware/v0.8.7/BUILD_INFO.txt

      - name: Publish v0.8.7 binaries to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/vesc_comp'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/v0.8.7/SmartESC_G30_NativeDash_v0.8.7_SHU.zip
          git add firmware/v0.8.7/SmartESC_G30_NativeDash_v0.8.7_IAP_Driver.bin
          git add firmware/v0.8.7/SHA256SUMS.txt firmware/v0.8.7/BUILD_INFO.txt
          if ! git diff --cached --quiet; then
            git commit -m "firmware: publish v0.8.7 SHU and IAP binaries [skip ci]"
            git push origin HEAD:vesc_comp
          fi

      - name: Upload G30 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartESC-G30-NativeDash-${{ github.run_number }}
          retention-days: 30
          path: |
            g30p/STM32CubeIDE/Debug/g30p.bin
            g30p/STM32CubeIDE/Debug/g30p.elf
            g30p/STM32CubeIDE/Debug/g30p.map
            SmartESC_G30_NativeDash_v0.8.7_SHU.zip
            firmware/v0.8.7/SmartESC_G30_NativeDash_v0.8.7_IAP_Driver.bin

      # Diagnostic report only: no flashable binary, image or firmware ZIP.
      # Remains available even when independent UART restore qualification
      # (and therefore SHU packaging) correctly blocks the release.
      - name: Upload SRAM audit only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G30-SRAM-audit-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: warn
          path: g30-ram-audit.json
