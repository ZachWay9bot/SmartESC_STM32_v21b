# This is a basic workflow to help you get started with Actions

name: Build on commit

# Controls when the workflow will run
on:
  workflow_dispatch:
  # Triggers the workflow on push or pull request events
  push:
    branches: [ vesc_comp, feature/shu-coast-delta, feature/g30-config-app, feature/deltaesc-branding, fix/g30-stock-flash-layout, audit/g30-hardware-baseline, freeze/deltaesc-v0.2-hwtest-2026-10-03 ]
  pull_request:
    branches: [ vesc_comp ]
    
jobs:
  build:

    runs-on: ubuntu-latest
    env:
      # ruleid: allowed-unsecure-commands
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true

    steps:
    - uses: actions/checkout@v4
    
    - name: log untrusted output
      run: |
        # disable command workflow processing
        echo "::stop-commands::`echo -n ${{ github.token }} | sha256sum | head -c 64`"
        # log untrusted output
        echo "untrusted output"
        # enable workflow command processing
        echo "::`echo -n ${{ github.token }} | sha256sum | head -c 64`::"
        
    - name: 'SHU source preflight'
      run: python3 tools/test_shu_preflight.py

    - name: 'Build G30P'
      uses: docker://wsbu/stm32cubeide:latest
      with:
        entrypoint: /opt/stm32cubeide/stm32cubeide
        args: --launcher.suppressErrors -nosplash -application org.eclipse.cdt.managedbuilder.core.headlessbuild -build g30p/Debug -importAll /github/workspace/

    - name: 'Package G30P for SHU'
      run: |
        cp "${{ github.workspace }}/g30p/STM32CubeIDE/Debug/g30p.bin" \
          "${{ github.workspace }}/DeltaESC_G30D_v0.2.bin"
        python3 tools/make_shu_zip.py \
          "${{ github.workspace }}/g30p/STM32CubeIDE/Debug/g30p.bin" \
          "${{ github.workspace }}/DeltaESC_G30D_v0.2_SHU.zip"

    - name: 'Upload Artifact G30P + SHU package'
      uses: actions/upload-artifact@v4
      with:
        path: |
          ${{ github.workspace }}/DeltaESC_G30D_v0.2.bin
          ${{ github.workspace }}/DeltaESC_G30D_v0.2_SHU.zip
        name: DeltaESC-G30D-v0.2-${{ github.run_number }}
        retention-days: 5

    - name: 'Build M365 regression target'
      uses: docker://wsbu/stm32cubeide:latest
      with:
        entrypoint: /opt/stm32cubeide/stm32cubeide
        args: --launcher.suppressErrors -nosplash -application org.eclipse.cdt.managedbuilder.core.headlessbuild -build m365/Debug -importAll /github/workspace/

    - name: 'Upload Artifact M365 - with build number'
      uses: actions/upload-artifact@v4
      with:
        path: ${{ github.workspace }}/m365/STM32CubeIDE/Debug/m365.bin
        name: m365-${{ github.run_number }}
        retention-days: 5
