name: Build G30 SHU candidate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to build
        required: true
        default: vesc_comp
  pull_request:
    branches: [ vesc_comp ]
    paths:
      - 'g30p/**'
      - 'common_files/**'
      - 'tools/make_shu_zip.py'
      - '.github/workflows/build_g30_shu.yml'

jobs:
  g30-shu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Checkout PR
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Build G30P
        uses: docker://wsbu/stm32cubeide:latest
        with:
          entrypoint: /opt/stm32cubeide/stm32cubeide
          args: --launcher.suppressErrors -nosplash -application org.eclipse.cdt.managedbuilder.core.headlessbuild -build g30p/Debug -importAll /github/workspace/

      - name: Validate and package SHU image
        run: |
          set -euxo pipefail
          BIN="${{ github.workspace }}/g30p/STM32CubeIDE/Debug/g30p.bin"
          test -s "$BIN"
          python3 tools/make_shu_zip.py \
            "$BIN" \
            "${{ github.workspace }}/SmartESC_G30_NativeDash_v0.8.7_SHU.zip"
          python3 - <<'PY'
          import struct
          from pathlib import Path
          p = Path("g30p/STM32CubeIDE/Debug/g30p.bin")
          b = p.read_bytes()
          sp, reset = struct.unpack_from("<II", b, 0)
          reset &= ~1
          assert len(b) <= 54 * 1024, f"image too large: {len(b)}"
          assert 0x20000000 <= sp <= 0x20005000, hex(sp)
          assert 0x08001000 <= reset < 0x0800E800, hex(reset)
          print(f"G30 SHU validation OK: {len(b)} bytes, SP=0x{sp:08X}, Reset=0x{reset:08X}")
          PY

      - name: Upload G30 SHU candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartESC-G30-NativeDash-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            g30p/STM32CubeIDE/Debug/g30p.bin
            g30p/STM32CubeIDE/Debug/g30p.elf
            g30p/STM32CubeIDE/Debug/g30p.map
            SmartESC_G30_SENSORLESS_VESCTOOL.zip
