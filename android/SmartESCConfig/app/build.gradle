plugins {
    id 'com.android.application'
}

android {
    namespace 'de.smartesc.config'
    compileSdk 35

    defaultConfig {
        applicationId "de.smartesc.config"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
